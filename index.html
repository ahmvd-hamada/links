<!doctype html>
<html lang="ar" dir="rtl">
<head>
<title>روابط أحمد حمادة</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Reem+Kufi:wght@600;700&display=swap">
<style>
  /* Layout: letterboxed film frame on top, then two labelled link lists (channels, social) as full-width rows */
  :root {
    --bg: #0a0e12;
    --surface: #121921;
    --line: #243040;
    --fg: #e9edf2;
    --muted: #8c9aab;
    --accent: #e9a54b;
    --frame-bg: #06090c;
    --frame-fg: #f1ece4;
    --frame-line: #3a4656;
    --font-display: "Reem Kufi", "IBM Plex Sans Arabic", system-ui, sans-serif;
    --font-body: "IBM Plex Sans Arabic", system-ui, -apple-system, "Segoe UI", sans-serif;
    --font-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
    color-scheme: dark;
  }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      --bg: #eef1f4;
      --surface: #ffffff;
      --line: #d3dae2;
      --fg: #101820;
      --muted: #566474;
      --accent: #a85d12;
      color-scheme: light;
    }
  }
  :root[data-theme="light"] {
    --bg: #eef1f4;
    --surface: #ffffff;
    --line: #d3dae2;
    --fg: #101820;
    --muted: #566474;
    --accent: #a85d12;
    color-scheme: light;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: var(--font-body);
    font-size: 16px;
    line-height: 1.6;
    padding-block: 28px 40px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  .page { max-width: 560px; margin-inline: auto; display: flex; flex-direction: column; gap: 32px; }

  /* Film frame */
  .frame {
    position: relative;
    aspect-ratio: 2.39 / 1;
    min-height: 150px;
    background:
      radial-gradient(70% 120% at 12% 0%, rgba(233,165,75,.28), transparent 60%),
      radial-gradient(60% 100% at 100% 100%, rgba(52,120,140,.30), transparent 65%),
      var(--frame-bg);
    color: var(--frame-fg);
    border: 1px solid var(--frame-line);
    border-radius: 4px;
    padding: 16px 18px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    overflow: hidden;
  }
  .frame::before, .frame::after {
    content: "";
    position: absolute;
    width: 14px; height: 14px;
    border: 1.5px solid var(--frame-fg);
    opacity: .55;
  }
  .frame::before { inset: 10px auto auto 10px; border-width: 1.5px 0 0 1.5px; }
  .frame::after { inset: auto 10px 10px auto; border-width: 0 1.5px 1.5px 0; }
  .frame-top, .frame-bottom {
    display: flex; justify-content: space-between; align-items: center; gap: 12px;
    font-family: var(--font-mono); font-size: 11px; letter-spacing: .12em; text-transform: uppercase;
    color: var(--frame-fg); opacity: .8;
    direction: ltr;
  }
  .rec { display: inline-flex; align-items: center; gap: 7px; }
  .rec i { width: 8px; height: 8px; border-radius: 50%; background: #e5484d; animation: pulse 2.4s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .25; } }
  .name {
    font-family: var(--font-display);
    font-weight: 700;
    font-size: clamp(34px, 9vw, 52px);
    line-height: 1.1;
    margin: 0;
    text-wrap: balance;
    padding-inline: 6px;
  }
  .tag { margin: 0; font-size: 14px; color: var(--frame-fg); opacity: .75; padding-inline: 6px; }

  /* Lists */
  section { display: flex; flex-direction: column; gap: 10px; }
  .label {
    display: flex; align-items: baseline; justify-content: space-between; gap: 12px;
    margin: 0 0 2px;
    font-family: var(--font-mono); font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted);
    border-bottom: 1px solid var(--line);
    padding-bottom: 8px;
    direction: ltr;
  }
  .label b { font-family: var(--font-display); font-size: 17px; letter-spacing: 0; text-transform: none; color: var(--fg); font-weight: 600; direction: rtl; }
  .links { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
  .link {
    display: grid;
    grid-template-columns: 44px minmax(0, 1fr) auto;
    align-items: center;
    gap: 14px;
    padding: 12px 14px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 6px;
    color: var(--fg);
    text-decoration: none;
    transition: border-color .18s, transform .18s;
  }
  .link:hover { border-color: var(--accent); transform: translateY(-1px); }
  .link:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .ico {
    width: 44px; height: 44px; border-radius: 6px;
    display: grid; place-items: center;
    border: 1px solid var(--line);
    color: var(--accent);
  }
  .ico svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .ico svg .solid { fill: currentColor; stroke: none; }
  .txt { min-width: 0; display: flex; flex-direction: column; }
  .title { font-weight: 600; font-size: 17px; line-height: 1.35; }
  .handle {
    font-family: var(--font-mono); font-size: 12.5px; color: var(--muted);
    direction: ltr; text-align: right; overflow-wrap: anywhere;
  }
  .go { color: var(--muted); font-size: 18px; transition: transform .18s, color .18s; }
  .link:hover .go { color: var(--accent); transform: translateX(-3px); }

  footer {
    font-family: var(--font-mono); font-size: 11px; letter-spacing: .1em; color: var(--muted);
    direction: ltr; text-align: center;
  }

  @media (prefers-reduced-motion: reduce) {
    .rec i { animation: none; }
    .link, .go { transition: none; }
    .link:hover { transform: none; }
  }
</style>

</head>
<body>
<main class="page" dir="rtl" lang="ar">
  <header class="frame">
    <div class="frame-top">
      <span class="rec"><i></i>REC</span>

    </div>
    <div>
      <h1 class="name">أحمد حمادة</h1>

    <div class="frame-bottom">

    </div>
  </header>

  <section aria-labelledby="yt">

    <ul class="links">

          <span class="txt"><span class="title">فيلم كريتف</span><span class="handle">@FiImar</span></span>
          <span class="go" aria-hidden="true">←</span>
        </a>
      </li>
      <li>
        <a class="link" href="https://www.youtube.com/@film_compo" target="_blank" rel="noopener">
          <span class="ico"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="2.5" y="5.5" width="19" height="13" rx="3.5"/><path class="solid" d="M10 9.2v5.6l4.8-2.8z"/></svg></span>
          <span class="txt"><span class="title">فيلم كومبو</span><span class="handle">@film_compo</span></span>
          <span class="go" aria-hidden="true">←</span>
        </a>
      </li>
      <li>
        <a class="link" href="https://www.youtube.com/@its.Archive" target="_blank" rel="noopener">
          <span class="ico"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="2.5" y="5.5" width="19" height="13" rx="3.5"/><path class="solid" d="M10 9.2v5.6l4.8-2.8z"/></svg></span>
          <span class="txt"><span class="title">قناة الوثائقيات</span><span class="handle">@its.Archive</span></span>
          <span class="go" aria-hidden="true">←</span>
        </a>

    </ul>
  </section>

  <section aria-labelledby="soc">
    <h2 class="label" id="soc"><span>SOCIAL</span><b>حساباتي</b></h2>
    <ul class="links">
      <li>
        <a class="link" href="https://www.instagram.com/ahmvd_hamada" target="_blank" rel="noopener">
          <span class="ico"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle class="solid" cx="17.3" cy="6.7" r="1.1"/></svg></span>

          <span class="txt"><span class="title">تيك توك</span><span class="handle">@ahmvd_hamada</span></span>

  </section>

  <footer>© 2026 · AHMED HAMADA</footer>
</main>
</body>
</html>
